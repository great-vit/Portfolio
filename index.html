<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<title>Lee Hanvit PM Workspace — 프로젝트 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F4F8;
    --surface:#FFFFFF;
    --ink:#101C2E;
    --ink-mid:#46536A;
    --ink-soft:#717D8F;
    --line:#DCE2EA;
    --line-strong:#BFC9D6;
    --navy:#1B3A6B;
    --navy-tint:#E8EDF5;
    --brass:#8E6A2C;
    --brass-tint:#F3EDE1;
    --slate-tint:#E9ECF1;
    --r:3px;
    --serif:'Noto Serif KR', Georgia, serif;
    --sans:'IBM Plex Sans KR', system-ui, sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:64px 28px 100px;}

  /* ── 헤더: 보고서 표지 ── */
  header.site{border-bottom:2px solid var(--ink);padding-bottom:24px;margin-bottom:0;}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    color:var(--navy);text-transform:uppercase;margin-bottom:14px;
  }
  .head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
  h1{
    font-family:var(--serif);font-weight:700;font-size:33px;
    margin:0;letter-spacing:-.015em;line-height:1.25;
  }
  .head-meta{
    font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
    text-align:right;line-height:1.9;letter-spacing:.02em;
  }

  /* ── 요약 밴드 ── */
  .stat-row{
    display:flex;border-bottom:1px solid var(--line);
    background:var(--surface);border-left:1px solid var(--line);
    border-right:1px solid var(--line);margin-bottom:44px;
  }
  .stat{
    flex:1;padding:16px 20px;border-right:1px solid var(--line);
    display:flex;align-items:baseline;gap:9px;
  }
  .stat:last-child{border-right:none;}
  .stat .n{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1;}
  .stat .l{
    font-family:var(--sans);font-size:12px;color:var(--ink-soft);
    letter-spacing:0;
  }

  /* ── 컨트롤 ── */
  .controls{
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:16px;margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .tabs{display:flex;gap:2px;}
  .tab{
    font-family:var(--sans);font-size:13.5px;font-weight:500;
    padding:9px 16px 11px;border:none;background:none;
    color:var(--ink-soft);cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .14s ease,border-color .14s ease;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
  .tab:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

  .search-box{position:relative;margin-bottom:9px;}
  .search-box input{
    font-family:var(--sans);font-size:13px;color:var(--ink);
    padding:8px 13px 8px 32px;width:214px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);
  }
  .search-box input::placeholder{color:var(--ink-soft);}
  .search-box input:focus{outline:none;border-color:var(--navy);}
  .search-box::before{
    content:"";position:absolute;left:13px;top:50%;width:9px;height:9px;
    transform:translateY(-50%);border:1.4px solid var(--ink-soft);border-radius:50%;
  }
  .search-box::after{
    content:"";position:absolute;left:20px;top:62%;width:6px;height:1.4px;
    background:var(--ink-soft);transform:rotate(45deg);
  }

  /* ── 카드 그리드 ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(302px,1fr));gap:14px;}
  .card{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:24px 24px 20px;text-align:left;
    font:inherit;color:inherit;cursor:pointer;
    display:flex;flex-direction:column;gap:13px;
    transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease;
  }
  .card::before{
    content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:2px;
    background:var(--navy);border-radius:var(--r) 0 0 var(--r);
    opacity:0;transition:opacity .16s ease;
  }
  .card:hover{border-color:var(--line-strong);box-shadow:0 3px 14px rgba(16,28,46,.07);transform:translateY(-1px);}
  .card:hover::before{opacity:1;}
  .card:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .card h3{font-family:var(--serif);font-size:16.5px;font-weight:600;margin:0;line-height:1.45;letter-spacing:-.01em;}
  .card p{font-size:13.5px;color:var(--ink-mid);line-height:1.68;margin:0;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
    font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:0;
    padding:4px 9px;border-radius:2px;white-space:nowrap;
  }
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}
  .badge.done{background:var(--navy-tint);color:var(--navy);}
  .badge.dev{background:var(--brass-tint);color:var(--brass);}
  .badge.plan{background:var(--slate-tint);color:var(--ink-mid);}

  .tags{display:flex;gap:5px;flex-wrap:wrap;}
  .tag{
    font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);
    border:1px solid var(--line);padding:2px 8px;border-radius:2px;
  }
  .card-foot{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);
    border-top:1px solid var(--line);padding-top:13px;margin-top:auto;
  }
  .meta{display:flex;gap:14px;flex-wrap:wrap;}
  .meta span{white-space:nowrap;}

  .empty{
    text-align:center;padding:70px 20px;color:var(--ink-soft);
    font-family:var(--sans);font-size:13.5px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  }
  footer{
    margin-top:60px;padding-top:22px;border-top:1px solid var(--line);
    font-family:var(--sans);font-size:12px;color:var(--ink-soft);
  }

  /* ── 상세 모달 ── */
  #overlay{
    position:fixed;inset:0;background:rgba(16,28,46,.5);
    display:none;align-items:center;justify-content:center;padding:24px;z-index:200;
  }
  #overlay.open{display:flex;}
  .modal{
    background:var(--surface);border-radius:var(--r);max-width:590px;width:100%;
    max-height:87vh;overflow-y:auto;padding:34px 34px 30px;position:relative;
    border-top:3px solid var(--navy);
  }
  .modal-close{
    position:absolute;top:20px;right:20px;background:none;
    border:1px solid var(--line);border-radius:2px;width:28px;height:28px;
    cursor:pointer;font-size:15px;color:var(--ink-soft);line-height:1;
  }
  .modal-close:hover{border-color:var(--ink);color:var(--ink);}
  .modal h2{
    font-family:var(--serif);font-size:21px;font-weight:600;
    margin:0 0 10px;padding-right:44px;line-height:1.4;letter-spacing:-.01em;
  }
  .m-status{margin-bottom:20px;}
  .m-desc{font-size:14px;line-height:1.8;color:var(--ink-mid);margin:0 0 8px;}
  .m-section{border-top:1px solid var(--line);padding-top:19px;margin-top:20px;}
  .m-section h4{
    font-family:var(--sans);font-size:12px;letter-spacing:.02em;
    color:var(--navy);margin:0 0 13px;font-weight:600;
  }
  .m-row{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);}
  .m-row:last-child{border-bottom:none;}
  .m-row .k{color:var(--ink-soft);white-space:nowrap;}
  .link-list{display:flex;flex-direction:column;gap:7px;}
  .link-item{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 15px;border:1px solid var(--line);border-radius:var(--r);
    text-decoration:none;color:var(--ink);font-size:13.5px;
    transition:border-color .14s ease,background .14s ease;
  }
  .link-item:hover{border-color:var(--navy);background:var(--navy-tint);}
  .link-item .arrow{font-family:var(--sans);color:var(--navy);font-size:12.5px;white-space:nowrap;}
  .no-link{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin:0;}

  @media (max-width:720px){
    .wrap{padding:44px 20px 72px;}
    h1{font-size:26px;}
    .head-row{flex-direction:column;align-items:flex-start;}
    .head-meta{text-align:left;}
    .stat-row{flex-wrap:wrap;border-top:1px solid var(--line);}
    .stat{flex:1 1 50%;border-bottom:1px solid var(--line);}
    .controls{flex-direction:column;align-items:stretch;}
    .tabs{overflow-x:auto;}
    .search-box input{width:100%;}
    .modal{padding:26px 20px 22px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="site">
    <div class="eyebrow">Portfolio — IT Service Planning</div>
    <div class="head-row">
      <h1>Lee Hanvit PM Workspace</h1>
      <div class="head-meta">
        IT 서비스 기획 / PM<br>
        Updated 2026.08
      </div>
    </div>
  </header>

  <div class="stat-row" id="statRow"></div>

  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="프로젝트 검색"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">검색 결과가 없습니다.</div>

  <footer>© Lee Hanvit · IT 서비스 기획 및 PM 포트폴리오</footer>
</div>

<div id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const PROJECTS = [
  {

    detail:"요구사항 정의부터 화면설계, 개발 관리, 배포까지 전 과정을 담당했습니다. 오픈 이후에는 네이버 검색 노출 문제를 진단해 서치어드바이저 색인 이슈와 서버 리다이렉트 구조를 원인별로 분리 분석하고, 스마트플레이스 연동까지 완료해 검색 노출을 정상화했습니다.",

    detail:"소스코드, 화면 기획서, 고객 QA 이력이라는 서로 다른 형식의 자료가 흩어져 있어 담당자마다 참고하는 정보가 달랐습니다. 자료를 하나씩 대조해 실제 반영이 확인된 내용만 추려내고, 크레딧 적립과 정산, 강의 등록 등 핵심 정책을 하나의 신뢰 가능한 매뉴얼로 재구성했습니다.",
    status:"완료", updated:"2026.08", protoCount:0, docCount:2,
    tags:["매뉴얼","정책 정비"],
    links:[
      {label:"실제 서비스 사이트",url:"https://edu.mensakorea.kr"},
      {label:"운영 매뉴얼 (PDF)",url:"mensa/mensa-manual.pdf"},
      {label:"FAQ 문서 (Word)",url:"mensa/mensa-faq.docx"}
    ]
  },
  {
    id:"anytour",
    name:"Anytour 웹사이트 구축",
    desc:"여행업계 클라이언트 웹사이트 신규 구축. 사용자, 관리자 화면 전체 설계.",
    detail:"사용자 화면과 관리자 화면을 모두 설계했습니다. 사용자 영역은 상품 목록과 상세, 인바운드, 반려동물 동반 여행, 리뷰, 문의 등으로 구성했고, 관리자 영역은 상품 관리, 공지사항, FAQ, 문의 관리, 관리자 계정 관리 등을 포함합니다. 도메인 연결 전 단계로, 실제 동작하는 프로토타입과 화면별 상세 설계를 담은 화면정의서를 함께 확인하실 수 있습니다.",
    status:"완료", updated:"2026.07", protoCount:53,
    tags:["PM","웹기획","관리자 설계"],
    links:[
      {label:"프로토타입 · 사용자 화면",url:"anytour/user/main.html"},
      {label:"프로토타입 · 관리자 화면",url:"anytour/admin/index.html"},
      {label:"화면정의서 · 전체 화면 설계",url:"anytour/anytour-desc/index.html"}
    ]
  },
  {
    id:"ksfarm",
    name:"KS팜 농사친구 영문 랜딩페이지",
    desc:"농업 스타트업 영문 랜딩페이지 기획 및 구축.",
    detail:"해외 대상 영문 랜딩페이지로, 서비스 소개와 제품, 회사 소개, 문의 페이지로 구성했습니다. 공통 컴포넌트와 페이지별 스타일을 분리한 모듈 구조로 작성해 이후 개발 단계에서 그대로 재활용할 수 있도록 설계했습니다.",

    tags:["웹기획","랜딩페이지","영문"],
    links:[{label:"프로토타입 보기",url:"ksfarm/index.html"}]
  },
  {
    id:"brain",
    name:"BN 두뇌훈련 서비스 UI/UX",
    desc:"두뇌 트레이닝 서비스 UI/UX 설계 및 게임 화면 프로토타입 제작.",
    detail:"인지 영역별 두뇌 트레이닝 서비스의 메인 화면과 훈련센터 화면을 설계했습니다. 훈련센터는 기억력, 수리력, 인지력, 집중력 4개 영역으로 구성했고, 영역별 게임 진입 구조와 난이도 구성, 랭킹 산정 규칙을 정리했으며, 기억력 영역은 숫자 기억력과 카드 짝맞추기, 순간 수량 인지 등 4가지 훈련 방식으로 세분화했습니다. 디자인 시스템을 별도로 정리해 화면 간 톤앤매너를 일관되게 유지했습니다.",
    status:"개발중", updated:"2026.08", protoCount:2,
    tags:["UX","게임 기획","디자인 시스템"],
    links:[
      {label:"프로토타입 · 메인 화면",url:"brain/index.html"},
      {label:"프로토타입 · 두뇌훈련 기억력 게임 허브",url:"brain/training-center.html#memory-hub"}
    ]
  },
  {
    id:"itda",
    name:"잇다 앱 서비스 기획",
    desc:"커뮤니티 소셜 앱 서비스 기획. 사용자 조사 기반 UX 개선 수행.",
    detail:"사용자 조사를 통해 니즈와 이탈 지점을 파악하고 UX 개선안을 도출했습니다. 모임 개설 시 핵심 기능에 도달하는 접근 단계를 3단계에서 1단계로 줄이고 버튼형 인터페이스를 새로 설계했으며, 베타 테스트 참여자의 의견을 수집해 리뉴얼 사항을 문서화하고 후속 기획에 반영했습니다.",
    status:"완료", updated:"2026.05", protoCount:0,
    tags:["서비스기획","UX 리서치","앱 기획"],
    links:[{label:"App Store에서 보기",url:"https://apps.apple.com/kr/app/id6780876614"}],
    stats:[
      {k:"모임 개설 접근 단계",v:"3단계 → 1단계"},
      {k:"프로세스 단축",v:"67%"},
      {k:"베타 테스트 참여",v:"100명"}
    ]
  }
];
const STATUS_CLS = {"기획중":"plan","개발중":"dev","완료":"done"};
const TABS = ["전체","기획중","개발중","완료"];
let activeTab="전체", query="";

function renderStats(){
  const counts={"전체":PROJECTS.length};
  TABS.slice(1).forEach(t=>counts[t]=PROJECTS.filter(p=>p.status===t).length);
  document.getElementById("statRow").innerHTML=["전체","완료","개발중","기획중"]
    .filter(k=>counts[k]>0)
    .map(k=>`<div class="stat"><span class="n">${counts[k]}</span><span class="l">${k}</span></div>`).join("");
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=TABS.map(t=>`<button class="tab ${t===activeTab?'active':''}" data-tab="${t}">${t}</button>`).join("");
  el.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{activeTab=b.dataset.tab;renderTabs();renderGrid();}));
}

function renderGrid(){
  const q=query.trim().toLowerCase();
  const filtered=PROJECTS.filter(p=>{
    const tabOk=activeTab==="전체"||p.status===activeTab;
    const qOk=!q||p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)||p.tags.some(t=>t.toLowerCase().includes(q));
    return tabOk&&qOk;
  });
  const grid=document.getElementById("grid"), empty=document.getElementById("emptyState");
  if(!filtered.length){grid.style.display="none";empty.style.display="block";return;}
  grid.style.display="grid";empty.style.display="none";
  grid.innerHTML=filtered.map(p=>`
    <button class="card" data-id="${p.id}">
      <div class="card-top">
        <h3>${p.name}</h3>
        <span class="badge ${STATUS_CLS[p.status]}">${p.status}</span>
      </div>
      <p>${p.desc}</p>
      <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div class="card-foot">
        <div class="meta">
          <span>업데이트 ${p.updated}</span>
          <span>${p.protoCount>0?`프로토타입 ${p.protoCount}종`:(p.docCount?`산출물 문서 ${p.docCount}종`:"산출물 문서")}</span>
        </div>
      </div>
    </button>`).join("");
  grid.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openModal(c.dataset.id)));
}

function openModal(id){
  const p=PROJECTS.find(x=>x.id===id);
  if(!p) return;
  let html=`
    <h2>${p.name}</h2>
    <div class="m-status"><span class="badge ${STATUS_CLS[p.status]}">${p.status}</span></div>
    <p class="m-desc">${p.detail}</p>
    <div class="m-section">
      <h4>프로젝트 정보</h4>
      <div class="m-row"><span class="k">업데이트</span><span>${p.updated}</span></div>
      ${p.protoCount>0?`<div class="m-row"><span class="k">프로토타입</span><span>${p.protoCount}종</span></div>`:""}
      ${p.docCount?`<div class="m-row"><span class="k">산출물 문서</span><span>${p.docCount}종</span></div>`:""}
      <div class="m-row"><span class="k">담당 역할</span><span>${p.tags.join(", ")}</span></div>
    </div>`;
  if(p.stats&&p.stats.length){
    html+=`<div class="m-section"><h4>주요 성과</h4>${p.stats.map(s=>`<div class="m-row"><span class="k">${s.k}</span><span>${s.v}</span></div>`).join("")}</div>`;
  }
  html+=`<div class="m-section"><h4>바로가기</h4>`;
  if(p.links.length){
    html+=`<div class="link-list">${p.links.map(l=>{
      const ext=l.url.startsWith("http");
      return `<a class="link-item" href="${l.url}"${ext?' target="_blank" rel="noopener"':' target="_blank"'}>
        <span>${l.label}</span><span class="arrow">${ext?"열기 ↗":"보기 →"}</span></a>`;
    }).join("")}</div>`;
  } else {
    html+=`<p class="no-link">공개 가능한 링크가 없는 프로젝트입니다. 상세 산출물은 면접 시 별도로 안내드립니다.</p>`;
  }
  html+=`</div>`;
  document.getElementById("modalBody").innerHTML=html;
  document.getElementById("overlay").classList.add("open");
}

function closeModal(){document.getElementById("overlay").classList.remove("open");}
document.getElementById("modalClose").addEventListener("click",closeModal);
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
document.getElementById("searchInput").addEventListener("input",e=>{query=e.target.value;renderGrid();});

renderStats();renderTabs();renderGrid();
</script>
</body>
</html>
