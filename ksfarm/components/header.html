<!--
  Shared site header. Each page copies this block and marks its own
  nav link with class="is-active" aria-current="page" (see /index.html,
  /product.html, /company.html, /contact.html for the per-page copies
  actually used by the prototype).
-->
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">
        <img src="assets/images/mascot-icon.png" alt="" class="brand__mascot">
        <img src="assets/images/friend-logo.png" alt="" class="brand__appicon">
      </span>
      <span class="brand__name">Farm Friend</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="product.html">Product</a>
      <a href="company.html">Company</a>
      <a href="contact.html">Contact</a>
    </nav>

    <a class="btn btn-primary site-header__cta" href="index.html#download">Download App</a>

    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="mobile-nav" id="mobile-nav" hidden>
    <a href="product.html">Product</a>
    <a href="company.html">Company</a>
    <a href="contact.html">Contact</a>
    <a class="btn btn-primary" href="index.html#download">Download App</a>
  </div>
</header>
