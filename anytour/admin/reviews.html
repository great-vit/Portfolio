<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리뷰 관리 | 애니투어 ADMIN</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page-script="assets/js/pages/reviews.js">

<div data-include="header"></div>

<nav class="a-topnav">
  <a href="products.html">상품관리</a>
  <a href="notices.html" class="is-active">사이트관리</a>
  <a href="inquiries.html">문의관리</a>
  <a href="admins.html">계정관리</a>
</nav>

<div class="a-body">
  <aside class="a-sidebar">
    <div class="a-sidebar-head">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/></svg>
      사이트관리
    </div>
    <ul>
      <li><a href="notices.html">공지사항 관리<span>›</span></a></li>
      <li><a href="faq.html">FAQ 관리<span>›</span></a></li>
      <li><a href="reviews.html" class="is-active">리뷰 관리<span>›</span></a></li>
    </ul>
  </aside>

  <main class="a-main">
    <div class="a-breadcrumb">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      HOME <span>›</span> 사이트관리 <span>›</span> 리뷰 관리
    </div>

    <div class="a-card">
      <div class="a-card-head">
        <span>리뷰 목록</span>
      </div>

      <div class="a-filter-row">
        <span class="a-filter-label">조건검색</span>
        <div class="a-filter-field">
          <input class="a-input a-w-full" type="text" id="searchKeyword" placeholder="제목 검색">
        </div>
      </div>
      <div class="a-filter-row">
        <span class="a-filter-label">여행종류</span>
        <div class="a-filter-field">
          <select class="a-select" id="searchCategory">
            <option value="">전체</option>
            <option value="pet">반려동물 동반여행</option>
            <option value="inbound">인바운드</option>
            <option value="package">패키지</option>
            <option value="golf">골프·테마</option>
            <option value="airhotel">항공·호텔</option>
            <option value="group">단체·효도여행</option>
          </select>
        </div>
      </div>
      <div class="a-filter-row">
        <span class="a-filter-label">별점</span>
        <div class="a-filter-field">
          <select class="a-select" id="searchRating">
            <option value="">전체</option>
            <option value="5">5점</option>
            <option value="4">4점</option>
            <option value="3">3점</option>
            <option value="2">2점</option>
            <option value="1">1점</option>
          </select>
        </div>
      </div>
      <div class="a-filter-actions">
        <button type="button" class="a-btn" id="resetBtn">초기화</button>
        <button type="button" class="a-btn a-btn-dark" id="searchBtn">검색</button>
      </div>

      <div class="a-table-toolbar">
        <span>검색결과 총 <strong id="resultCount">0</strong>건</span>
      </div>
      <div class="a-table-wrap">
        <table class="a-table">
          <thead>
            <tr>
              <th style="width:40px;"><input type="checkbox" id="checkAll"></th>
              <th style="width:60px;">번호</th>
              <th style="width:90px;">평점</th>
              <th>제목</th>
              <th style="width:140px;">여행종류</th>
              <th style="width:140px;">등록일</th>
              <th style="width:90px;">관리</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="a-table-footer">
        <button type="button" class="a-btn a-btn-danger a-btn-sm" id="bulkDeleteBtn">선택삭제</button>
      </div>
    </div>
  </main>
</div>

<!-- Detail modal -->
<div class="a-modal-overlay" id="reviewModal">
  <div class="a-modal">
    <div class="a-modal-head">
      <span>리뷰 상세</span>
      <button type="button" class="a-modal-close" data-modal-close>&times;</button>
    </div>
    <div class="a-modal-body">
      <div class="a-form-grid-2">
        <div class="a-form-row">
          <label>평점</label>
          <select class="a-select a-w-full" id="vRating" disabled>
            <option value="5">★★★★★ (5점)</option>
            <option value="4">★★★★ (4점)</option>
            <option value="3">★★★ (3점)</option>
            <option value="2">★★ (2점)</option>
            <option value="1">★ (1점)</option>
          </select>
        </div>
        <div class="a-form-row">
          <label>여행종류</label>
          <select class="a-select a-w-full" id="vCategory" disabled>
            <option value="pet">반려동물 동반여행</option>
            <option value="inbound">인바운드</option>
            <option value="package">패키지</option>
            <option value="golf">골프·테마</option>
            <option value="airhotel">항공·호텔</option>
            <option value="group">단체·효도여행</option>
          </select>
        </div>
      </div>
      <div class="a-form-row"><label>제목</label><input class="a-input a-w-full" id="vTitle" readonly></div>
      <div class="a-form-row">
        <label>내용</label>
        <textarea class="a-textarea a-w-full" id="vContent" readonly></textarea>
      </div>
      <div class="a-form-row"><label>등록일</label><input class="a-input a-w-full" id="vCreatedAt" readonly></div>
      <div class="a-form-row">
        <label>첨부 사진</label>
        <img id="vPhoto" src="" alt="" style="max-width:100%; border-radius:4px;">
      </div>
    </div>
    <div class="a-modal-foot">
      <button type="button" class="a-btn" data-modal-close>닫기</button>
      <button type="button" class="a-btn a-btn-dark" id="editToggleBtn">수정</button>
      <button type="button" class="a-btn a-btn-dark" id="saveBtn" style="display:none;">저장</button>
    </div>
  </div>
</div>

<script src="assets/js/seed-data.js"></script>
<script src="assets/js/admin-include.js"></script>
</body>
</html>
