<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 관리 | 애니투어 ADMIN</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page-script="assets/js/pages/notices.js">

<div data-include="header"></div>

<nav class="a-topnav">
  <a href="products.html">상품관리</a>
  <a href="notices.html" class="is-active">사이트관리</a>
  <a href="inquiries.html">문의관리</a>
  <a href="admins.html">계정관리</a>
</nav>

<div class="a-body">
  <aside class="a-sidebar">
    <div class="a-sidebar-head">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/></svg>
      사이트관리
    </div>
    <ul>
      <li><a href="notices.html" class="is-active">공지사항 관리<span>›</span></a></li>
      <li><a href="faq.html">FAQ 관리<span>›</span></a></li>
      <li><a href="reviews.html">리뷰 관리<span>›</span></a></li>
    </ul>
  </aside>

  <main class="a-main">
    <div class="a-breadcrumb">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      HOME <span>›</span> 사이트관리 <span>›</span> 공지사항 관리
    </div>

    <div class="a-card">
      <div class="a-card-head">
        <span>공지사항</span>
        <button type="button" class="a-btn a-btn-primary a-btn-sm" data-modal-open="noticeModal">+ 등록하기</button>
      </div>

      <div class="a-filter-row">
        <span class="a-filter-label">조건검색</span>
        <div class="a-filter-field">
          <input class="a-input a-w-full" type="text" id="searchKeyword" placeholder="제목, 내용 검색">
        </div>
      </div>
      <div class="a-filter-row">
        <span class="a-filter-label">노출여부</span>
        <div class="a-filter-field">
          <select class="a-select" id="searchVisible">
            <option value="">전체</option>
            <option value="1">노출</option>
            <option value="0">숨김</option>
          </select>
        </div>
      </div>
      <div class="a-filter-actions">
        <button type="button" class="a-btn" id="resetBtn">초기화</button>
        <button type="button" class="a-btn a-btn-dark" id="searchBtn">검색</button>
      </div>

      <div class="a-table-toolbar">
        <span>검색결과 총 <strong id="resultCount">0</strong>건</span>
      </div>
      <div class="a-table-wrap">
        <table class="a-table">
          <thead>
            <tr>
              <th style="width:40px;"><input type="checkbox" id="checkAll"></th>
              <th style="width:60px;">번호</th>
              <th>글제목</th>
              <th style="width:90px;">상단고정</th>
              <th style="width:90px;">노출여부</th>
              <th style="width:70px;">조회수</th>
              <th style="width:140px;">등록일</th>
              <th style="width:110px;">관리</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="a-table-footer">
        <button type="button" class="a-btn a-btn-danger a-btn-sm" id="bulkDeleteBtn">선택삭제</button>
      </div>
    </div>
  </main>
</div>

<!-- Register / edit modal -->
<div class="a-modal-overlay" id="noticeModal">
  <div class="a-modal">
    <div class="a-modal-head">
      <span id="noticeModalTitle">공지사항 등록</span>
      <button type="button" class="a-modal-close" data-modal-close>&times;</button>
    </div>
    <form id="noticeForm">
      <div class="a-modal-body">
        <input type="hidden" id="noticeId">
        <div class="a-form-row">
          <label for="fTitle">제목 <span class="a-req">*</span></label>
          <input class="a-input a-w-full" type="text" id="fTitle" required>
        </div>
        <div class="a-form-row">
          <label for="fContent">내용 <span class="a-req">*</span></label>
          <textarea class="a-textarea" id="fContent" required></textarea>
        </div>
        <div class="a-form-grid-2">
          <div class="a-form-row">
            <label><input type="checkbox" id="fPinned"> 상단고정</label>
          </div>
          <div class="a-form-row">
            <label for="fVisible">노출여부</label>
            <select class="a-select a-w-full" id="fVisible">
              <option value="1">노출</option>
              <option value="0">숨김</option>
            </select>
          </div>
        </div>
      </div>
      <div class="a-modal-foot">
        <button type="button" class="a-btn" data-modal-close>취소</button>
        <button type="submit" class="a-btn a-btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/seed-data.js"></script>
<script src="assets/js/admin-include.js"></script>
</body>
</html>
