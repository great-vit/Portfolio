<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의·예약 관리 | 애니투어 ADMIN</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-page-script="assets/js/pages/inquiries.js">

<div data-include="header"></div>

<nav class="a-topnav">
  <a href="products.html">상품관리</a>
  <a href="notices.html">사이트관리</a>
  <a href="inquiries.html" class="is-active">문의관리</a>
  <a href="admins.html">계정관리</a>
</nav>

<div class="a-body">
  <aside class="a-sidebar">
    <div class="a-sidebar-head">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      문의관리
    </div>
    <ul>
      <li><a href="inquiries.html" class="is-active">문의·예약 관리<span>›</span></a></li>
    </ul>
  </aside>

  <main class="a-main">
    <div class="a-breadcrumb">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      HOME <span>›</span> 문의관리
    </div>

    <div class="a-card">
      <div class="a-card-head">
        <span>문의·예약 목록</span>
      </div>

      <div class="a-filter-row">
        <span class="a-filter-label">조건검색</span>
        <div class="a-filter-field">
          <input class="a-input a-w-full" type="text" id="searchKeyword" placeholder="이름, 연락처, 이메일 검색">
        </div>
      </div>
      <div class="a-filter-row">
        <span class="a-filter-label">처리상태</span>
        <div class="a-filter-field">
          <select class="a-select" id="searchStatus">
            <option value="">전체</option>
            <option value="대기">대기</option>
            <option value="처리중">처리중</option>
            <option value="완료">완료</option>
          </select>
        </div>
      </div>
      <div class="a-filter-actions">
        <button type="button" class="a-btn" id="resetBtn">초기화</button>
        <button type="button" class="a-btn a-btn-dark" id="searchBtn">검색</button>
      </div>

      <div class="a-table-toolbar">
        <span>검색결과 총 <strong id="resultCount">0</strong>건</span>
      </div>
      <div class="a-table-wrap">
        <table class="a-table">
          <thead>
            <tr>
              <th style="width:40px;"><input type="checkbox" id="checkAll"></th>
              <th style="width:60px;">번호</th>
              <th style="width:90px;">이름</th>
              <th style="width:130px;">연락처</th>
              <th style="width:130px;">여행종류</th>
              <th>문의내용</th>
              <th style="width:90px;">처리상태</th>
              <th style="width:140px;">접수일</th>
              <th style="width:90px;">관리</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="a-table-footer">
        <button type="button" class="a-btn a-btn-danger a-btn-sm" id="bulkDeleteBtn">선택삭제</button>
      </div>
    </div>
  </main>
</div>

<!-- Detail / status modal -->
<div class="a-modal-overlay" id="inquiryModal">
  <div class="a-modal">
    <div class="a-modal-head">
      <span>문의 상세</span>
      <button type="button" class="a-modal-close" data-modal-close>&times;</button>
    </div>
    <form id="inquiryForm">
      <div class="a-modal-body">
        <input type="hidden" id="inquiryId">
        <div class="a-form-grid-2">
          <div class="a-form-row"><label>이름</label><input class="a-input a-w-full" id="vName" readonly></div>
          <div class="a-form-row"><label>연락처</label><input class="a-input a-w-full" id="vPhone" readonly></div>
        </div>
        <div class="a-form-grid-2">
          <div class="a-form-row"><label>이메일</label><input class="a-input a-w-full" id="vEmail" readonly></div>
          <div class="a-form-row"><label>여행종류</label><input class="a-input a-w-full" id="vType" readonly></div>
        </div>
        <div class="a-form-row">
          <label>문의 내용</label>
          <textarea class="a-textarea" id="vMessage" readonly></textarea>
        </div>
        <div class="a-form-row">
          <label for="fStatus">처리상태</label>
          <select class="a-select a-w-full" id="fStatus">
            <option value="대기">대기</option>
            <option value="처리중">처리중</option>
            <option value="완료">완료</option>
          </select>
        </div>
      </div>
      <div class="a-modal-foot">
        <button type="button" class="a-btn" data-modal-close>닫기</button>
        <button type="submit" class="a-btn a-btn-primary">상태 저장</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/seed-data.js"></script>
<script src="assets/js/admin-include.js"></script>
</body>
</html>
